<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Wijha — Command Centre</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700;9..40,800&family=IBM+Plex+Mono:wght@400;500&family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#f4f2ee;--surface:#fff;--line:#e2ddd3;--ink:#1b1b1f;--muted:#6b6a72;--dim:#9a979f;--amber:#e0961d;--amber-ink:#8a5a05;--amber-soft:#fff4dd;--green:#1f8a5b;--green-soft:#e6f5ec;--red:#c23b3b;--red-soft:#fdeaea;--blue:#3b6ea8;--blue-soft:#e8f0fa;--dark:#1f1e22;--ar:'Cairo',sans-serif;--sans:'DM Sans',sans-serif;--mono:'IBM Plex Mono',monospace}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--ar);background:var(--bg);color:var(--ink);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
button{font:inherit;cursor:pointer;border:0;background:none;color:inherit} input,select,textarea{font:inherit;color:inherit}
a{color:inherit;text-decoration:none}
.mono{font-family:var(--mono);font-size:12px;direction:ltr;unicode-bidi:isolate}
.hidden{display:none!important}
.dim{color:var(--dim)}
/* shell */
.shell{display:grid;grid-template-columns:230px 1fr;min-height:100vh}
.side{background:var(--dark);color:#e9e5dc;padding:18px 14px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:6px}
.brand{font-size:20px;font-weight:800;padding:6px 10px 14px}.brand span{color:var(--amber);font-family:var(--sans);font-size:12px}
.nav a{display:flex;justify-content:space-between;align-items:center;padding:9px 12px;border-radius:9px;font-weight:700;color:#c9c4b8}
.nav a.on,.nav a:hover{background:#2e2d33;color:#fff}
.nav .n{font-family:var(--mono);font-size:11px;background:#3a393f;padding:1px 7px;border-radius:999px}
.nav .n.hot{background:var(--amber);color:#1b1b1f}
.who{margin-top:auto;font-size:12px;color:#9b978f;padding:10px 12px;border-top:1px solid #35343a}
.who b{display:block;color:#fff}
.main{padding:22px 26px 80px;min-width:0}
h1{font-size:22px;font-weight:800;margin-bottom:4px} h2{font-size:15px;font-weight:800;margin:18px 0 10px}
.sub{color:var(--muted);font-size:13px;margin-bottom:16px}
/* controls */
.btn{display:inline-flex;align-items:center;gap:6px;padding:8px 13px;border-radius:9px;font-weight:700;font-size:13px;white-space:nowrap;border:1px solid var(--line);background:var(--surface)}
.btn:hover{border-color:var(--ink)} .btn.pri{background:var(--amber);border-color:var(--amber)} .btn.pri:hover{background:#c8850f}
.btn.danger{color:var(--red);border-color:var(--red-soft);background:var(--red-soft)} .btn.ok{color:var(--green);background:var(--green-soft);border-color:transparent}
.btn.sm{padding:4px 9px;font-size:12px} .btn:disabled{opacity:.5;cursor:default}
.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:0 0 14px}
.bar input,.bar select{border:1px solid var(--line);border-radius:9px;padding:8px 11px;background:var(--surface);font-size:13px;outline:none}
.bar input:focus{border-color:var(--amber)} .bar .grow{flex:1;min-width:200px}
.pill{display:inline-block;font-size:11px;font-weight:800;padding:2px 9px;border-radius:999px;background:var(--bg);color:var(--muted);border:1px solid var(--line)}
.pill.ok{background:var(--green-soft);color:var(--green);border-color:transparent}.pill.warn{background:var(--amber-soft);color:var(--amber-ink);border-color:transparent}
.pill.bad{background:var(--red-soft);color:var(--red);border-color:transparent}.pill.info{background:var(--blue-soft);color:var(--blue);border-color:transparent}
/* kpis */
.kpis{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px;margin-bottom:18px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.kpi b{font-size:24px;font-weight:800;font-family:var(--sans);display:block;line-height:1.1}.kpi small{color:var(--muted);font-size:12px}
.kpi.warn{border-color:var(--amber)} .kpi.bad{border-color:var(--red)}
/* table */
.tw{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:auto}
table{width:100%;border-collapse:collapse;font-size:13px;min-width:900px}
th{text-align:start;font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--dim);padding:9px 10px;border-bottom:1px solid var(--line);white-space:nowrap;position:sticky;top:0;background:var(--surface)}
td{padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0} tbody tr:hover{background:#faf7f0}
td small{display:block;color:var(--muted);font-size:11px} td .acts{display:flex;gap:4px;justify-content:flex-end}
.num{font-family:var(--mono);font-size:12px;direction:ltr;text-align:end}
tr.sel{background:var(--amber-soft)}
/* modal */
.ov{position:fixed;inset:0;background:rgba(27,27,31,.5);display:grid;place-items:center;z-index:50;padding:20px}
.md{background:var(--surface);border-radius:16px;width:min(880px,100%);max-height:92vh;overflow:auto;box-shadow:0 30px 80px -30px rgba(0,0,0,.6)}
.md .hd{display:flex;justify-content:space-between;align-items:center;padding:16px 20px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--surface)}
.md .hd b{font-size:16px} .md .bd{padding:18px 20px} .md .ft{display:flex;gap:8px;justify-content:flex-end;padding:14px 20px;border-top:1px solid var(--line);position:sticky;bottom:0;background:var(--surface)}
.form{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px 12px}
.form label{display:block;font-size:11.5px;font-weight:700;color:var(--muted)}
.form input,.form select,.form textarea{display:block;width:100%;border:1px solid var(--line);border-radius:8px;padding:8px 10px;margin-top:4px;font-size:13px;background:var(--bg);outline:none}
.form input:focus,.form select:focus,.form textarea:focus{border-color:var(--amber);background:var(--surface)}
.form .w2{grid-column:span 2} .form .w3{grid-column:1/-1} .form textarea{min-height:70px;resize:vertical}
.form .sec{grid-column:1/-1;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--amber-ink);font-family:var(--mono);margin-top:8px;padding-top:8px;border-top:1px dashed var(--line)}
.err{background:var(--red-soft);color:var(--red);padding:10px 12px;border-radius:9px;font-size:13px;margin-top:10px;white-space:pre-wrap;font-family:var(--mono);direction:ltr;text-align:start}
.note{font-size:12px;color:var(--muted);margin-top:8px}
/* login */
.login{max-width:420px;margin:80px auto;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:26px}
.login input{width:100%;border:1px solid var(--line);border-radius:9px;padding:10px 12px;margin:6px 0 12px;font-size:14px;direction:ltr}
/* chat */
.chatgrid{display:grid;grid-template-columns:320px 1fr;gap:12px;height:calc(100vh - 160px)}
.tlist{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:auto}
.titem{padding:10px 12px;border-bottom:1px solid var(--line);cursor:pointer;display:flex;justify-content:space-between;gap:8px}
.titem.on{background:var(--amber-soft)} .titem b{display:block;font-size:13px} .titem small{display:block;color:var(--muted);font-size:11px}
.cwin{background:var(--surface);border:1px solid var(--line);border-radius:12px;display:flex;flex-direction:column}
.cbody{flex:1;overflow:auto;padding:14px;display:flex;flex-direction:column;gap:6px;background:var(--bg)}
.msg{max-width:74%;padding:8px 12px;border-radius:12px;font-size:13px}
.msg.client{background:var(--surface);border:1px solid var(--line);align-self:flex-start}.msg.company{background:var(--amber-soft);align-self:flex-end}.msg.admin{background:var(--blue-soft);align-self:flex-end}
.msg.blocked{opacity:.6;border:1px dashed var(--red)} .msg time{display:block;font-size:10px;color:var(--dim);font-family:var(--mono);margin-top:2px}
.cfoot{display:flex;gap:8px;padding:10px;border-top:1px solid var(--line)} .cfoot input{flex:1;border:1px solid var(--line);border-radius:9px;padding:9px 11px}
.toast{position:fixed;bottom:22px;inset-inline-end:22px;background:var(--dark);color:#fff;padding:11px 16px;border-radius:10px;font-weight:700;z-index:99;max-width:360px;font-size:13px}
.toast.bad{background:var(--red)}
.tabs{display:flex;gap:6px;margin-bottom:12px}.tabs button{padding:7px 12px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-weight:700;font-size:12.5px;color:var(--muted)}.tabs button.on{background:var(--amber-soft);border-color:var(--amber);color:var(--amber-ink)}
.chip{display:inline-block;padding:2px 8px;border-radius:999px;background:var(--bg);border:1px solid var(--line);font-size:11px;margin:2px 2px 0 0}
pre.json{background:var(--bg);border:1px solid var(--line);border-radius:9px;padding:10px;font-size:11px;direction:ltr;text-align:start;overflow:auto;max-height:260px}
@media(max-width:900px){.shell{grid-template-columns:1fr}.side{position:static;height:auto;flex-direction:row;flex-wrap:wrap}.who{margin:0;border:0}.chatgrid{grid-template-columns:1fr;height:auto}}
.drop{display:flex;flex-direction:column;align-items:center;gap:6px;border:2px dashed var(--line,#ddd);border-radius:16px;padding:34px 16px;cursor:pointer;text-align:center;background:#fffdf8}
.drop.over,.drop:hover{border-color:#e0961d;background:#fff4dd}
.btn.danger{background:#fdeaea;color:#c23b3b}
</style>
</head>

['SG','سنغافورة','Singapore','+65'],['TH','تايلاند','Thailand','+66'],['PH','الفلبين','Philippines','+63'],
['VN','فيتنام','Vietnam','+84'],['AZ','أذربيجان','Azerbaijan','+994'],['GE','جورجيا','Georgia','+995'],

['ID','إندونيسيا','Indonesia'],['AZ','أذربيجان','Azerbaijan'],['GE','جورجيا','Georgia'],
['OTHER','أخرى','Other']];
const AGE_RANGES=[['18-24','١٨ – ٢٤','18 – 24'],['25-34','٢٥ – ٣٤','25 – 34'],['35-44','٣٥ – ٤٤','35 – 44'],
['45-54','٤٥ – ٥٤','45 – 54'],['55-64','٥٥ – ٦٤','55 – 64'],['65+','٦٥ فأكثر','65+']];
const cName=(c,L)=>{const r=COUNTRIES.find(x=>x[0]===c)||VISA_TARGETS.find(x=>x[0]===c);return r?(L==='ar'?r[1]:r[2]):(c||'—')};

/* ═══════════ state ═══════════ */
const ADMIN_ROLES=['admin','wijha_admin'], CO_ROLES=['company','company_admin','company_staff'];
const isAdminRole=r=>ADMIN_ROLES.includes(r), isCoRole=r=>CO_ROLES.includes(r);
/* Wijha scout = inspector / sales person: adds offers for ANY company, everything goes to admin review */
const isScout=r=>r==='wijha_scout', anyCo=r=>isAdminRole(r)||isScout(r);
const myRole=()=>(S.roles||[]).find(r=>r.key===S.me?.wijha_role_key);
const perm=a=>{const r=myRole(); if(!r) return isAdminRole(S.me?.role)?'full':isScout(S.me?.role)?(a==='offers'?'edit':a==='companies'?'view':'none'):(a==='clients'?'none':a==='offers'?'edit':'view'); return (r.permissions||{})[a]||'none'};
const can=(a,lvl='view')=>{const p=perm(a); return p==='full'||(p==='edit'&&lvl!=='full')||(p==='view'&&lvl==='view')};
/* public project URL + public anon key (safe to publish; access is enforced by database rules). Never put the service-role key here. */
const DEFAULT_URL='https://ejxndvelxocklapmiuvu.supabase.co', DEFAULT_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImVqeG5kdmVseG9ja2xhcG1pdXZ1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODc0ODIyNjMsImV4cCI6MjEwMzA1ODI2M30.mJbyBJDSDDxop3R5RXNx-s2xmRKuHKZa_6_1tC_7TJw';
const S={url:localStorage.getItem('wijha_url')||DEFAULT_URL,key:localStorage.getItem('wijha_key')||DEFAULT_KEY,
 tok:JSON.parse(localStorage.getItem('wijha_admin_tok')||'null'),me:null,view:'overview',
 offers:[],companies:[],profiles:[],imports:[],threads:[],events:[],terms:[],filter:{q:'',cat:'',status:'',co:'',svc:''},sel:new Set(),thread:null,msgs:[]};
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
/* file extension / folder helpers: never trust a file name; every upload goes in the uploader's own folder */
const safeExt=(f,d)=>((f.name.split('.').pop()||d).toLowerCase().replace(/[^a-z0-9]/g,'').slice(0,5))||d;
const upFolder=cid=>anyCo(S.me?.role)?(cid||'admin'):S.me.company_id;
const nf=n=>n==null?'—':Number(n).toLocaleString('en-US');
const FX={EGP:1,EUR:57.5,USD:48.6,GBP:66,SAR:13.4};
const CATL={tours:'رحلة خارجية',hajj:'حج',umrah:'عمرة'};
const root=document.getElementById('root');
function toast(m,bad){const d=document.createElement('div');d.className='toast'+(bad?' bad':'');d.textContent=m;document.body.appendChild(d);setTimeout(()=>d.remove(),3600)}

/* ═══════════ API (plain fetch, JWT bearer) ═══════════ */
const H=()=>({apikey:S.key,'Content-Type':'application/json',Authorization:'Bearer '+(S.tok?.access_token||S.key)});
async function api(path,opt={}){
 const r=await fetch(S.url+'/rest/v1/'+path,{...opt,headers:{...H(),...(opt.headers||{})}});
 if(r.status===401&&S.tok?.refresh_token&&!opt._retried){ await refresh(); return api(path,{...opt,_retried:true}); }
 const t=await r.text(); let b; try{b=t?JSON.parse(t):null}catch{b=t}
 if(!r.ok) throw new Error(typeof b==='object'&&b?(b.message||b.hint||JSON.stringify(b)):(t||('HTTP '+r.status)));
 return b;
}
const get=p=>api(p);
const post=(p,body,prefer='return=representation')=>api(p,{method:'POST',body:JSON.stringify(body),headers:{Prefer:prefer}});
const patch=(p,body)=>api(p,{method:'PATCH',body:JSON.stringify(body),headers:{Prefer:'return=representation'}});
async function del(p){
 const r = await api(p,{method:'DELETE',headers:{Prefer:'return=representation'}});
 if (Array.isArray(r) && r.length===0)
   throw new Error('لم يُحذف شيء — على الأرجح لا تملك صلاحية حذف هذا العنصر (تحقّق من صلاحيات RLS لحسابك).');
 return r;
}
const rpc=(fn,args)=>api('rpc/'+fn,{method:'POST',body:JSON.stringify(args||{})});
async function login(email,password){
 const r=await fetch(S.url+'/auth/v1/token?grant_type=password',{method:'POST',headers:{apikey:S.key,'Content-Type':'application/json'},body:JSON.stringify({email,password})});
 const b=await r.json(); if(!r.ok) throw new Error(b.error_description||b.msg||b.error||'login failed');
 S.tok=b; localStorage.setItem('wijha_admin_tok',JSON.stringify(b));
}
async function refresh(){
 const r=await fetch(S.url+'/auth/v1/token?grant_type=refresh_token',{method:'POST',headers:{apikey:S.key,'Content-Type':'application/json'},body:JSON.stringify({refresh_token:S.tok.refresh_token})});
 const b=await r.json(); if(!r.ok){logout();throw new Error('session expired')} S.tok=b; localStorage.setItem('wijha_admin_tok',JSON.stringify(b));
}
function logout(){S.tok=null;S.me=null;localStorage.removeItem('wijha_admin_tok');render()}

/* ═══════════ boot ═══════════ */
async function boot(){
 if(!S.url||!S.key||!S.tok){render();return}
 try{ const p=await get('profiles?select=*&id=eq.'+S.tok.user.id); S.me=p[0]||null;
  if(!S.me||!(isAdminRole(S.me.role)||isCoRole(S.me.role)||isScout(S.me.role))){ render(`<div class="login"><h1>ليس حساب مدير أو شركة</h1><p class="sub">هذا الحساب (${esc(S.tok.user.email)}) دوره <b>${esc(S.me?.role||'—')}</b>. شغّل في SQL:</p><pre class="json">update profiles set role='admin' where email='${esc(S.tok.user.email)}';</pre><button class="btn" onclick="logout()">خروج</button></div>`); return; }
  await loadAll(); render();
 }catch(e){ toast(e.message,true); render(); }
}
async function loadAll(){
 const R=await Promise.all([
  get('admin_offers?select=*&order=updated_at.desc.nullslast').catch(()=>get('offers?select=*&order=updated_at.desc.nullslast')),
  get('companies?select=*&order=name_ar'),
  get('profiles?select=*&order=created_at.desc'),
  get('wijha_imports?select=*&order=created_at.desc').catch(()=>[]),
  get('wijha_threads?select=*&order=last_message_at.desc').catch(()=>[]),
  get('offer_events?select=kind,offer_id,company_id,at&order=at.desc&limit=2000').catch(()=>[]),
  get('search_terms?select=term,at&order=at.desc&limit=1000').catch(()=>[]),

function fld(k,label,type,extra){
 const v=ED.full[k]; const cls=extra&&typeof extra==='string'?extra:'';
 if(k==='ref_code') return `<div class="${cls}"><label>${label}<input value="${esc(v||'سيُنشأ تلقائياً عند الحفظ')}" disabled style="font-family:var(--mono);color:var(--muted)"></label></div>`;
 if(type==='company') return `<div class="${cls}"><label>${label}<select data-k="${k}" ${!anyCo(S.me.role)?'disabled':''}>${(anyCo(S.me.role)?S.companies:S.companies.filter(c=>c.id===S.me.company_id)).map(c=>`<option value="${c.id}" ${v===c.id?'selected':''}>${esc(c.name_ar)}</option>`).join('')}</select></label></div>`;
 if(type==='select') return `<div class="${cls}"><label>${label}<select data-k="${k}">${extra.map(x=>`<option ${v===x?'selected':''}>${x}</option>`).join('')}</select></label></div>`;
 if(type==='bool') return `<div class="${cls}"><label>${label}<select data-k="${k}" data-bool="1"><option value="true" ${v?'selected':''}>نعم</option><option value="false" ${!v?'selected':''}>لا</option></select></label></div>`;
 if(type==='textarea') return `<div class="${cls}"><label>${label}<textarea data-k="${k}">${esc(v??'')}</textarea></label></div>`;
 return `<div class="${cls}"><label>${label}<input data-k="${k}" type="${type}" value="${esc(v??'')}"></label></div>`;
}

async function uploadCover(file){
 if(!file)return;
 try{ const ext=safeExt(file,'jpg');
  const path=`${upFolder(ED.full?.company_id)}/covers/${Date.now()}-${Math.random().toString(36).slice(2,8)}.${ext}`;
  const r=await fetch(S.url+'/storage/v1/object/offer-photos/'+path,{method:'POST',
   headers:{apikey:S.key,Authorization:'Bearer '+(S.tok?.access_token||''),'Content-Type':file.type},body:file});
  if(!r.ok) throw new Error((await r.text()).slice(0,140));
  ED.full.cover_url = S.url+'/storage/v1/object/public/offer-photos/'+path;
  toast('تم رفع الصورة'); drawEditor();
 }catch(e){toast(e.message,true)}
}
function readMain(){ if(ED.tab!=='main')return; if(!anyCo(S.me.role)) ED.full.company_id=S.me.company_id; document.querySelectorAll('#ov [data-k]').forEach(el=>{ const k=el.dataset.k; if(el.disabled)return; let v=el.value;
 if(el.dataset.bool) v=v==='true'; else if(el.type==='number') v=v===''?null:Number(v); else if(v==='') v=null; ED.full[k]=v; }); }
function closeEd(){document.getElementById('ov')?.remove();ED=null}
async function saveOffer(submit){
 readMain(); const f={...ED.full}; if(submit) f.status='pending_review'; delete f.id; delete f.created_at; delete f.updated_at; delete f.ref_code;
 if(!f.expires_on){ document.getElementById('ederr').innerHTML='<div class="err">تاريخ انتهاء العرض إلزامي — لا يمكن الحفظ بدونه</div>'; return; }
 if(f.starts_on && f.expires_on > f.starts_on){ document.getElementById('ederr').innerHTML='<div class="err">تاريخ الانتهاء يجب أن يكون قبل تاريخ السفر</div>'; return; }
 try{
  let id=ED.id;
  const admin=isAdminRole(S.me.role);
  if(!admin){ f.review_state='pending'; f.review_note=null; }
  if(id) await patch('offers?id=eq.'+id,f); else { const r=await post('offers',f); id=r[0].id; }
  if(!admin){ try{ await post('wijha_offer_revisions',{offer_id:id,changed_by:S.me.id,company_id:S.me.company_id,after_data:f,state:'pending',note:'تعديل من الشركة'},'return=minimal') }catch(e){} }
  // children: replace-all strategy (simple and safe for an admin tool)
  // stages first, keeping each day's detailed items (offer_stage_items) attached to the new stage rows
  if(ED.id) await del(`offer_stages?offer_id=eq.${id}`).catch(e=>{ if(!/لم يُحذف/.test(e.message)) throw e; });
  if(ED.stages.length){
    const rows=await post('offer_stages',ED.stages.map((s,i)=>({offer_id:id,sort_order:s.sort_order??i,title_ar:s.title_ar||'—',title_en:s.title_en||null,day_label:s.day_label||null,description_ar:s.description_ar||null,photo_url:s.photo_url||null})));
    const kids=[]; rows.forEach((r,i)=>(ED.stages[i].items||[]).forEach((it,j)=>kids.push({stage_id:r.id,block_ar:it.block_ar||null,block_order:it.block_order??0,item_cat:it.item_cat||null,text_ar:it.text_ar||'—',text_en:it.text_en||null,sort_order:it.sort_order??j})));
    if(kids.length) await post('offer_stage_items',kids,'return=minimal');
  }
  for(const [tb,rows,map] of [
    ['offer_items',ED.items,it=>({offer_id:id,kind:it.kind,item_cat:it.item_cat||null,text_ar:it.text_ar||'—',price_text:it.price_text||null,sort_order:it.sort_order??0})],
    ['offer_hotels',ED.hotels,h=>({offer_id:id,sort_order:h.sort_order??0,city_ar:h.city_ar||'—',hotel_name:h.hotel_name||'—',nights:h.nights||null,date_range:h.date_range||null,hotel_id:h.hotel_id||null})],
    ['offer_notes',ED.notes,n=>({offer_id:id,kind:n.kind,label_ar:n.label_ar||null,text_ar:n.text_ar||null,sort_order:n.sort_order??0})]]){
   if(ED.id) await del(`${tb}?offer_id=eq.${id}`);
   if(rows.length) await post(tb,rows.map(map),'return=minimal');
  }
  toast(isAdminRole(S.me.role)?'تم الحفظ':'تم الحفظ — بانتظار مراجعة فريق وجهة'); closeEd(); await loadAll(); render();
 }catch(e){ document.getElementById('ederr').innerHTML='<div class="err">'+esc(e.message)+'</div>' }
}
async function toggleSample(id,val){ try{ await patch('offers?id=eq.'+id,{is_sample:val}); const o=S.offers.find(x=>x.id===id); if(o)o.is_sample=val; toast(val?'تم التعليم كعرض تجريبي':'تم التعليم كعرض حقيقي'); render(); }catch(e){toast(e.message,true)} }
async function reviewOffer(id,state){
 const note = state==='rejected' ? prompt('سبب الرفض (يظهر للشركة):') : null;
 if(state==='rejected' && note===null) return;
 try{ await patch('offers?id=eq.'+id,{review_state:state,review_note:note});
  await patch(`wijha_offer_revisions?offer_id=eq.${id}&state=eq.pending`,{state,reviewed_by:S.me.id,reviewed_at:new Date().toISOString()}).catch(()=>{});
  toast(state==='approved'?'تم الاعتماد':'تم الرفض'); await loadAll(); render(); }catch(e){toast(e.message,true)}
}

async function uploadDoc(){

async function openDoc(path){
 try{ const r=await fetch(S.url+'/storage/v1/object/sign/company-docs/'+path,{method:'POST',
   headers:{apikey:S.key,Authorization:'Bearer '+(S.tok?.access_token||''),'Content-Type':'application/json'},
   body:JSON.stringify({expiresIn:600})});
  const b=await r.json(); if(!r.ok) throw new Error(b.message||'no access');
  window.open(S.url+'/storage/v1'+b.signedURL,'_blank');
 }catch(e){toast(e.message,true)}
}
async function saveCo(){
 readCo(); const f={...EC.full}; delete f.id; delete f.created_at; delete f.updated_at;
 try{
  if(EC_FILE) f.commercial_registry_url=await uploadDoc();
  if(!f.name_ar) throw new Error('اسم الشركة مطلوب');
  if(!f.slug) f.slug=(f.name_en||f.name_ar).toLowerCase().replace(/[^a-z0-9\u0600-\u06FF]+/g,'-').replace(/^-|-$/g,'')||('co-'+Date.now());
  if(isAdminRole(S.me.role)&&f.wijha_review){
    f.wijha_reviewed_at=new Date().toISOString(); f.wijha_reviewed_by=S.me.id;
    f.etaa_verified = f.wijha_review==='approved';
  }
  if(EC.id) await patch('companies?id=eq.'+EC.id,f); else await post('companies',f);
  toast('تم الحفظ'); closeEd(); EC_FILE=null; await loadAll(); render();
 }catch(e){ const el=document.getElementById('ederr'); if(el) el.innerHTML='<div class="err">'+esc(e.message)+'</div>'; else toast(e.message,true); }
}

async function createOfferFromIntake(importId){

/* voice: record audio + live Arabic transcript in the browser (free, no extra service). The transcript is what gets read. */
function toggleVoice(){
 if(INTAKE.rec){ INTAKE.rec.stop(); INTAKE.sr?.stop(); return; }
 if(!navigator.mediaDevices?.getUserMedia){ toast('المتصفح لا يدعم التسجيل — اكتب العرض في الخانة',true); return; }
 navigator.mediaDevices.getUserMedia({audio:true}).then(stream=>{
  const chunks=[]; const rec=new MediaRecorder(stream); INTAKE.rec=rec;
  rec.ondataavailable=e=>chunks.push(e.data);
  rec.onstop=()=>{ stream.getTracks().forEach(t=>t.stop()); const type=rec.mimeType||'audio/webm';
    INTAKE.audio=new File([new Blob(chunks,{type})],'voice-'+Date.now()+(type.includes('mp4')?'.m4a':'.webm'),{type});
    INTAKE.rec=null; INTAKE.text=document.getElementById('inText').value; render(); };
  rec.start();
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(SR){ const sr=new SR(); INTAKE.sr=sr; sr.lang='ar-EG'; sr.continuous=true; sr.interimResults=true;
    const ta=document.getElementById('inText'); const base=ta.value?ta.value+'\n':'';
    sr.onresult=e=>{ let txt=''; for(let i=0;i<e.results.length;i++) txt+=e.results[i][0].transcript+' '; ta.value=base+txt.trim(); };
    sr.onerror=()=>{}; try{sr.start()}catch(e){} }
  else document.getElementById('recNote').textContent='جارٍ التسجيل… (هذا المتصفح لا يكتب الكلام تلقائياً؛ استخدم Chrome أو اكتب ملخصاً بعد التسجيل)';
  const b=document.getElementById('recBtn'); b.textContent='⏹ إيقاف التسجيل'; b.classList.add('danger');
 }).catch(()=>toast('لم يُسمح باستخدام الميكروفون',true));
}

async function submitIntake(){
 const cid=document.getElementById('inCo')?.value, note=document.getElementById('inNote')?.value||null;
 const tx=(document.getElementById('inText')?.value||'').trim(), url=(document.getElementById('inUrl')?.value||'').trim();
 const files=INTAKE.files||[], audio=INTAKE.audio, err=document.getElementById('inErr'), prog=document.getElementById('inProg');
 err.innerHTML='';
 try{
  if(!cid) throw new Error('اختر الشركة');
  if(!tx && !url && !files.length && !audio) throw new Error('ارفع ملفاً أو سجّل أو اكتب تفاصيل العرض');
  if(url && !/^https?:\/\//.test(url)) throw new Error('الرابط غير صحيح');
  prog.innerHTML='<div class="note-box">⏳ جارٍ الرفع…</div>';
  const ids=[];
  const add=async row=>{ const r=await post('wijha_imports',{company_id:cid,submitted_by:S.me.id,note,status:'queued',...row}); ids.push(r[0].id); };
  for(const f of files){ const path=await uploadIntake(f,cid); await add({kind:(f.name.split('.').pop()||'file').toLowerCase(),file_path:path,raw_text:files.length===1?(tx||null):null}); }
  if(audio){ const path=await uploadIntake(audio,cid); await add({kind:'voice',file_path:path,raw_text:tx||null}); }
  else if(url) await add({kind:'url',url,raw_text:files.length?null:(tx||null)});
  else if(!files.length || (files.length>1&&tx)) await add({kind:'text',raw_text:tx});
  INTAKE={files:[]};
  for(let i=0;i<ids.length;i++){ prog.innerHTML=`<div class="note-box">🤖 جارٍ قراءة العرض ${ids.length>1?`(${i+1} من ${ids.length})`:''}… قد يستغرق دقيقة</div>`; await processImport(ids[i]); }
  await loadAll(); render();
 }catch(e){ err.innerHTML='<div class="err">'+esc(e.message)+'</div>'; prog.innerHTML=''; }
}

/* calls the wijha-extract function; if it is not deployed yet the upload simply waits in the list for the team */
async function processImport(id,redraw){

  const b=await r.json().catch(()=>({}));

  else if(!r.ok) toast(b.error||('تعذّرت القراءة ('+r.status+')'),true);
  else{ const n=b.created?.length||0, w=(b.created||[]).reduce((a,c)=>a+(c.checks?.length||0),0);
    toast(n>1?`تم إنشاء ${n} عروض — راجعها قبل الإرسال`:`تم إنشاء العرض — راجعه قبل الإرسال${w?` (${w} نقطة تحتاج تأكيد)`:''}`);
    if(n===1&&redraw!==false){ await loadAll(); render(); return editOffer(b.created[0].offer_id); } }

}

async function uploadIntake(file,cid){

 const r=await fetch(S.url+'/storage/v1/object/offer-intake/'+path,{method:'POST',
  headers:{apikey:S.key,Authorization:'Bearer '+(S.tok?.access_token||''),'Content-Type':(file.type||'application/octet-stream').split(';')[0]},body:file});
 if(!r.ok) throw new Error('رفع الملف فشل: '+(await r.text()).slice(0,140));
 return path;
}

   (S.suppliers||[]).filter(x=>x.contact_email===sup[0]).map(x=>`• ${x.title_ar} — ${x.cost} ${x.currency} ${(UNITS.find(u=>u[0]===x.unit)||[])[1]||''}${x.valid_to?` (مسجّل ساري حتى ${x.valid_to})`:''}`).join('\n')+
   '\n\nوإفادتنا بأي تعديل أو مدة صلاحية جديدة.\n\nشكراً لتعاونكم.'});
}

/* ═══════════ EMAILS ═══════════ */
function emailsV(){
 const box=(S.emails||[]);
 return `<h1>البريد <span class="pill">${box.length}</span></h1>
 <p class="sub">أرسل التقرير اليومي أو رسالة مخصّصة إلى مسؤول شركة أو موظف بعينه. كل رسالة تُحفظ في السجل.</p>
 <div class="bar">
  <button class="btn pri" onclick="composeEmail({template:'daily_digest'})">✉ التقرير اليومي</button>
  <button class="btn" onclick="composeEmail({template:'enquiry'})">✉ إشعار استفسار</button>
  <button class="btn" onclick="composeEmail({template:'custom'})">✉ رسالة مخصّصة</button>
  <button class="btn" onclick="openTemplates()">القوالب ومعاينتها</button></div>
 <div class="tw"><table><thead><tr><th>إلى</th><th>الموضوع</th><th>القالب</th><th>الحالة</th><th>التاريخ</th><th></th></tr></thead><tbody>
 ${box.map(e=>`<tr><td><b>${esc(e.to_name||'')}</b><small class="mono">${esc(e.to_email)}</small></td><td>${esc(e.subject)}</td>
  <td>${esc(e.template)}</td><td><span class="pill ${e.status==='sent'?'ok':e.status==='failed'?'bad':'warn'}">${esc(e.status)}</span>${e.error?`<small>${esc(e.error)}</small>`:''}</td>
  <td class="num">${(e.created_at||'').slice(0,16).replace('T',' ')}</td>
  <td class="acts"><button class="btn sm" onclick="viewEmail('${e.id}')">عرض</button>${e.status==='queued'?`<button class="btn sm ok" onclick="markSent('${e.id}')">تم الإرسال</button>`:''}</td></tr>`).join('')||'<tr><td colspan="6" class="dim">لا رسائل بعد</td></tr>'}
 </tbody></table></div>
 <p class="note">الإرسال الفعلي يحتاج مزوّد بريد (Resend أو SendGrid) عبر دالة خلفية. حتى ذلك، السجل يعمل كطابور: انسخ الرسالة وأرسلها، ثم علّمها "تم الإرسال".</p>`;
}
function openTemplates(){
 let ov=document.getElementById('ov'); if(!ov){ov=document.createElement('div');ov.id='ov';ov.className='ov';document.body.appendChild(ov)}
 ov.innerHTML=`<div class="md"><div class="hd"><b>قوالب البريد</b><button class="btn sm" onclick="closeEd()">إغلاق</button></div>
 <div class="bd"><p class="note">هذه القوالب مدمجة هنا. استخدم زر «رسالة جديدة» لإرسال أي منها إلى مسؤول شركة أو موظف.</p>
  <details style="margin-bottom:12px"><summary class="btn sm" style="display:inline-block;cursor:pointer">👁 معاينة التصميم الكامل (بيانات تجريبية)</summary>
   <iframe src="./emails.html" title="email preview" style="width:100%;height:70vh;border:1px solid var(--line);border-radius:12px;margin-top:10px;background:#fff" loading="lazy"></iframe></details>
  ${[['daily_digest','التقرير اليومي','يُرسل ٩ صباحاً: المشاهدات والاستفسارات والحفظ، أعلى الرحلات أداءً، كلمات البحث التي وصلت لرحلاتهم، فرص غير مغطاة، وما يحتاج انتباههم اليوم.'],
     ['enquiry','إشعار استفسار','يُرسل فور وصول استفسار: بيانات الرحلة، نوع الغرفة والعدد، الإجمالي بالجنيه، ميزانية العميل، مسار تصفحه، والمقاعد المتبقية، مع مهلة رد ٤ ساعات.'],
     ['supplier_price_check','تأكيد أسعار مورد','قائمة ببنود المورد وتواريخ صلاحيتها المسجّلة، لطلب تأكيدها قبل إصدار العرض.'],
     ['approval','اعتماد شركة','إخطار الشركة بأن ترخيصها اعتُمد وأن رحلاتها ستظهر للعملاء.'],
     ['rejection','رفض طلب','إخطار الشركة بسبب الرفض وما يلزم لإعادة التقديم.']].map(([k,n,d])=>
   `<div class="rowitem"><div><b>${n}</b><small>${d}</small></div><button class="btn sm pri" onclick="closeEd();composeEmail({template:'${k}'})">استخدم</button></div>`).join('')}
 </div></div>`;
}
function recipientOptions(){
 const staff=(S.profiles||[]).filter(p=>p.role!=='client'&&p.email);
 return staff.map(p=>`<option value="${esc(p.email)}" data-name="${esc(p.name||'')}" data-co="${p.company_id||''}">${esc(p.name||p.email)} — ${esc(coN(p.company_id))}</option>`).join('')
  + S.companies.filter(c=>c.email).map(c=>`<option value="${esc(c.email)}" data-name="${esc(c.name_ar)}" data-co="${c.id}">${esc(c.name_ar)} (بريد الشركة)</option>`).join('');
}
function composeEmail(pre){
 pre=pre||{};
 let ov=document.getElementById('ov'); if(!ov){ov=document.createElement('div');ov.id='ov';ov.className='ov';document.body.appendChild(ov)}
 const subj=pre.subject||({daily_digest:'تقريرك اليومي على وجهة',enquiry:'استفسار جديد على إحدى رحلاتك',supplier_price_check:'تأكيد أسعار قبل إصدار العرض',custom:''})[pre.template||'custom'];
 const body=pre.body||({daily_digest:'صباح الخير،\n\nملخّص أداء رحلاتكم أمس على وجهة:\n\n• المشاهدات: —\n• الاستفسارات: —\n• الأعلى أداءً: —\n\nالكلمات التي وصلت لرحلاتكم: —\n\nيحتاج انتباهكم: استفسارات بلا رد، ورحلات بلا برنامج يومي.\n\nفريق وجهة',
  enquiry:'تحية طيبة،\n\nوصل استفسار جديد على إحدى رحلاتكم. تجدونه في لوحة الشركة تحت "الاستفسارات".\n\nمهلة الرد أربع ساعات — الرد خلال ساعة يرفع فرصة الحجز.\n\nفريق وجهة',
  custom:''})[pre.template||'custom'];
 ov.innerHTML=`<div class="md"><div class="hd"><b>رسالة جديدة</b><button class="btn sm" onclick="closeEd()">إغلاق</button></div>
 <div class="bd"><div class="form">
  <div class="w2"><label>إلى<select id="emTo" onchange="const o=this.selectedOptions[0];document.getElementById('emName').value=o.dataset.name||'';document.getElementById('emCo').value=o.dataset.co||''">
    ${pre.to?`<option value="${esc(pre.to)}" selected>${esc(pre.to)}</option>`:''}${recipientOptions()}</select></label></div>
  <div><label>الاسم<input id="emName"></label></div><input type="hidden" id="emCo">
  <div><label>القالب<select id="emTpl">${['daily_digest','enquiry','supplier_price_check','approval','rejection','custom'].map(t=>`<option ${(pre.template||'custom')===t?'selected':''}>${t}</option>`).join('')}</select></label></div>
  <div class="w3"><label>الموضوع<input id="emSubj" value="${esc(subj)}"></label></div>
  <div class="w3"><label>النص<textarea id="emBody" style="min-height:220px">${esc(body)}</textarea></label></div>
 </div><div id="ederr"></div></div>
 <div class="ft"><button class="btn" onclick="copyEmail()">نسخ النص</button><button class="btn pri" onclick="queueEmail()">حفظ في الطابور</button></div></div>`;
}
function copyEmail(){ const t=document.getElementById('emSubj').value+'\n\n'+document.getElementById('emBody').value;
 navigator.clipboard.writeText(t); toast('تم النسخ'); }
async function queueEmail(){
 try{ const to=document.getElementById('emTo').value; if(!to) throw new Error('اختر المستلم');
  await post('wijha_emails',{template:document.getElementById('emTpl').value,to_email:to,
   to_name:document.getElementById('emName').value||null, company_id:document.getElementById('emCo').value||null,
   subject:document.getElementById('emSubj').value, body_text:document.getElementById('emBody').value,
   created_by:S.me.id},'return=minimal');
  toast('حُفظت في الطابور'); closeEd(); await loadAll(); render();
 }catch(e){document.getElementById('ederr').innerHTML='<div class="err">'+esc(e.message)+'</div>'}
}
function viewEmail(id){ const e=(S.emails||[]).find(x=>x.id===id);
 let ov=document.getElementById('ov'); if(!ov){ov=document.createElement('div');ov.id='ov';ov.className='ov';document.body.appendChild(ov)}
 ov.innerHTML=`<div class="md"><div class="hd"><b>${esc(e.subject)}</b><button class="btn sm" onclick="closeEd()">إغلاق</button></div>
 <div class="bd"><p class="note">إلى: ${esc(e.to_name||'')} &lt;${esc(e.to_email)}&gt;</p><pre class="json" style="direction:rtl;text-align:start;white-space:pre-wrap;font-family:var(--ar)">${esc(e.body_text||'')}</pre></div></div>`; }
async function markSent(id){ try{ await patch('wijha_emails?id=eq.'+id,{status:'sent',sent_at:new Date().toISOString()}); await loadAll(); render(); }catch(e){toast(e.message,true)} }

/* ═══════════ CHATS ═══════════ */
function chatsV(){
 const th=S.thread?S.threads.find(t=>t.id===S.thread):null;
 const pn=id=>S.profiles.find(p=>p.id===id)?.name||S.profiles.find(p=>p.id===id)?.email||'عميل';
 return `<h1>المحادثات <span class="pill">${S.threads.length}</span></h1><p class="sub">كل محادثة عميل ↔ شركة. الأرقام والبريد تُحجب تلقائياً قبل التخزين. الإدارة تستطيع التدخل في أي محادثة.</p>
 <div class="chatgrid"><div class="tlist">${S.threads.map(t=>{const o=S.offers.find(x=>x.id===t.offer_id);return `<div class="titem ${S.thread===t.id?'on':''}" onclick="S.thread='${t.id}';render()"><div><b>${esc(pn(t.client_id))} ↔ ${esc(coN(t.company_id))}</b><small>${esc(o?.title_ar||'—')}</small><small>${(t.last_message_at||'').replace('T',' ').slice(0,16)} · ${t.last_message_from==='client'?'ينتظر رد الشركة':'رُدّ عليه'}</small></div>${t.company_unread?`<span class="pill bad">${t.company_unread}</span>`:''}</div>`}).join('')||'<div class="titem dim">لا محادثات بعد</div>'}</div>
 <div class="cwin">${th?`<div class="titem" style="cursor:default"><div><b>${esc(pn(th.client_id))} ↔ ${esc(coN(th.company_id))}</b><small>${esc(S.offers.find(x=>x.id===th.offer_id)?.title_ar||'')}</small></div><span class="pill ${th.status==='open'?'ok':''}">${th.status}</span></div><div class="cbody" id="cbody">…</div>
  <div class="cfoot"><input id="cin" placeholder="${isAdminRole(S.me.role)?'رد كإدارة…':'رد على العميل…'}" onkeydown="if(event.key==='Enter')sendAdmin()"><button class="btn pri" onclick="sendAdmin()">إرسال</button></div>`:'<div class="cbody dim" style="place-content:center;text-align:center">اختر محادثة</div>'}</div></div>`;
}
async function loadMsgs(){ try{ S.msgs=await get('wijha_messages?select=*&thread_id=eq.'+S.thread+'&order=created_at'); const b=document.getElementById('cbody'); if(!b)return;
 b.innerHTML=S.msgs.map(m=>`<div class="msg ${m.sender_role}${m.blocked?' blocked':''}">${esc(m.body)}<time>${m.sender_role} · ${(m.created_at||'').replace('T',' ').slice(0,16)}</time></div>`).join('')||'<span class="dim">لا رسائل</span>'; b.scrollTop=b.scrollHeight; }catch(e){toast(e.message,true)} }
async function sendAdmin(){ const v=cin.value.trim(); if(!v)return; cin.value=''; try{ await post('wijha_messages',{thread_id:S.thread,sender_id:S.me.id,sender_role:isAdminRole(S.me.role)?'admin':'company',body:v},'return=minimal'); await rpc('wijha_mark_read',{p_thread:S.thread}).catch(()=>{}); await loadMsgs(); }catch(e){toast(e.message,true)} }

/* ═══════════ INSIGHTS ═══════════ */
function insights(){
 const wk=S.events.filter(e=>new Date(e.at)>Date.now()-7*864e5); const byO={}; wk.forEach(e=>{byO[e.offer_id]=byO[e.offer_id]||{view:0,save:0,enquiry:0,chat_open:0};byO[e.offer_id][e.kind]++});
 const top=Object.entries(byO).map(([id,v])=>({o:S.offers.find(x=>x.id===id),...v})).filter(r=>r.o).sort((a,b)=>(b.enquiry*5+b.save*2+b.view)-(a.enquiry*5+a.save*2+a.view)).slice(0,12);
 const terms={}; S.terms.filter(t=>new Date(t.at)>Date.now()-7*864e5).forEach(t=>{const k=(t.term||'').trim().toLowerCase();if(k)terms[k]=(terms[k]||0)+1}); const tt=Object.entries(terms).sort((a,b)=>b[1]-a[1]).slice(0,20);
 return `<h1>الطلب والبحث</h1><p class="sub">آخر ٧ أيام من <span class="mono">offer_events</span> و<span class="mono">search_terms</span>. هذه هي المصادر التي يُبنى منها التقرير اليومي للشركات.</p>
 <div class="kpis"><div class="kpi"><b>${wk.filter(e=>e.kind==='view').length}</b><small>مشاهدة</small></div><div class="kpi"><b>${wk.filter(e=>e.kind==='save').length}</b><small>حفظ</small></div><div class="kpi"><b>${wk.filter(e=>e.kind==='enquiry').length}</b><small>استفسار</small></div><div class="kpi"><b>${wk.filter(e=>e.kind==='chat_open').length}</b><small>محادثة</small></div><div class="kpi"><b>${S.terms.length}</b><small>عملية بحث مسجّلة</small></div></div>
 <h2>الأعلى تفاعلاً</h2><div class="tw"><table><thead><tr><th>الرحلة</th><th>الشركة</th><th>مشاهدة</th><th>حفظ</th><th>استفسار</th><th>محادثة</th></tr></thead><tbody>${top.map(r=>`<tr><td><b>${esc(r.o.title_ar)}</b></td><td>${esc(coN(r.o.company_id))}</td><td class="num">${r.view}</td><td class="num">${r.save}</td><td class="num">${r.enquiry}</td><td class="num">${r.chat_open}</td></tr>`).join('')||'<tr><td colspan="6" class="dim">لا أحداث بعد — تظهر بعد تصفح حقيقي للموقع</td></tr>'}</tbody></table></div>
 <h2>كلمات البحث</h2><div class="tw"><table style="min-width:0"><tbody>${tt.map(([k,n])=>`<tr><td>${esc(k)}</td><td class="num">${n}</td></tr>`).join('')||'<tr><td class="dim">لا بحث مسجّل بعد</td></tr>'}</tbody></table></div>`;
}
boot();
</script>
</body>
</html>
